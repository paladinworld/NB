# RVI portfolio inputs. Edit this file as new information becomes available.
# Sources to check each quarter:
#   - Fund factsheet / "What's in this fund" tab in Robinhood
#   - SEC filings (N-PORT, N-CSR) — https://www.sec.gov/cgi-bin/browse-edgar
#   - Prospectus and semi-annual reports
#   - Secondary market signals: Forge Global, EquityZen, Hiive
#   - Last primary funding round: TechCrunch, PitchBook, company press releases

fund:
  ticker: RVI
  name: Robinhood Ventures Fund I
  inception_date: 2026-03-06

  # ---- Capital structure ----
  # Verify against latest 10-Q / N-CSR. The IPO raised $314.35M (per factsheet);
  # closed-end fund IPOs typically price at $25/share, implying ~12.574M shares.
  ipo_raise_M: 314.35
  ipo_price: 25.00              # VERIFY from prospectus
  shares_outstanding_M: 12.574  # VERIFY: ipo_raise_M / ipo_price, or filings

  # ---- Market price ----
  market_price: 45.70
  price_as_of: 2026-05-19

  # ---- Pre-IPO sleeve size ($M) ----
  # Total NAV of the Jan 31, 2026 sleeve (holdings + cash, before the IPO raise).
  # The fund's factsheet shows percent weights as of Jan 31, but not the $ total.
  # Look in the prospectus / S-1 (Statement of Investments) or first 10-Q.
  # Plausible range $150-350M based on closed-end fund seed-stage sizing.
  pre_ipo_sleeve_M: 260.0       # ASSUMPTION — VERIFY from prospectus

  # ---- Cash & liabilities ($M) ----
  # If null, computed as (cash_weight_in_sleeve × pre_ipo_sleeve_M) + ipo_raise_M.
  # Override with the actual figure if you have it from a 10-Q.
  # Post-IPO deployments (subtract from cash):
  #   Stripe       $14.58M   2026-03-09  Class B Common, secondary
  #   ElevenLabs   $20.00M   2026-03-12  Series D Preferred, primary
  #   OpenAI       $75.00M   2026-04-17  Common stock
  #   Total        $109.58M
  # Cash = 0.1978 × 260 + 314.35 − 109.58 = 51.43 + 314.35 − 109.58 = 256.20
  cash_and_equivalents_M: 256.20
  other_liabilities_M: 0
  accrued_mgmt_fee_M: 0

  # ---- Fees ----
  management_fee_pct: 2.00      # VERIFY from prospectus

# ---- Blending weights ----
# How much to weight each valuation method when computing blended fair value
# for each private holding. Must sum to 1.0.
valuation_weights:
  last_round: 0.30
  secondary: 0.45
  public_comp: 0.25

# ---- Holdings ----
# Per-holding fields:
#   weight_pct                — % of pre-IPO sleeve NAV (from factsheet)
#   fund_mark_M               — $M reported by fund. If null, auto-computed
#                               from weight_pct × pre_ipo_sleeve_M.
#   rvi_ownership_pct         — RVI's % of company FDS. If null, auto-computed
#                               from fund_mark_M / (last_round_valuation_B × 1000).
#   last_round_valuation_B    — most recent primary round, post-money, $B
#   last_round_date           — YYYY-MM-DD
#   secondary_premium_pct     — secondary market mark vs last round (+ for premium)
#   illiquidity_discount_pct  — applied to secondary & public-comp estimates
#   public_comp_ev_to_revenue — NTM EV/Revenue multiple of public peers
#   company_revenue_ttm_B     — company TTM revenue, $B
#   notes                     — context worth preserving

holdings:
  - name: Databricks
    weight_pct: 23.24
    last_round_valuation_B: 62.0            # Series J Dec 2024 — VERIFY for newer rounds
    last_round_date: 2024-12-17
    secondary_premium_pct: 25               # late-2025 secondaries ~$75-85B implied — VERIFY
    illiquidity_discount_pct: 10            # very liquid secondary market for DB
    public_comp_ev_to_revenue: 20           # SNOW/MDB/NET NTM EV/Rev with AI premium
    company_revenue_ttm_B: 3.5              # ARR approaching $3.5B late 2025 — VERIFY
    notes: |
      AI/data platform, largest position. IPO speculated for 2026.
      A real DB IPO would force a re-mark and likely compress RVI's premium.

  - name: Revolut
    weight_pct: 14.30
    last_round_valuation_B: 45.0            # Aug 2024 employee tender — VERIFY
    last_round_date: 2024-08-16
    secondary_premium_pct: 15
    illiquidity_discount_pct: 15
    public_comp_ev_to_revenue: 7            # HOOD/NU/SOFI blend
    company_revenue_ttm_B: 2.4              # FY24 ~$2.2-2.5B reported — VERIFY
    notes: |
      Profitable neobank, EU + global. Profitability supports higher multiple
      than typical neobank peers. UK IPO filing has been rumored.

  - name: Mercor
    weight_pct: 14.23
    last_round_valuation_B: 2.0             # mid-2024 round — HIGHLY UNCERTAIN, may be stale
    last_round_date: 2024-09-15
    secondary_premium_pct: 50               # hot AI-adjacent name; guess
    illiquidity_discount_pct: 25
    public_comp_ev_to_revenue: 30           # AI premium; speculative
    company_revenue_ttm_B: 0.1              # revenue undisclosed; placeholder
    notes: |
      AI talent / contractor platform. Has likely raised again in 2025 at much
      higher valuation. ALL inputs here are speculative — this is the lowest-
      confidence holding in the model. Look for a primary funding round update.

  - name: Airwallex
    weight_pct: 7.11
    last_round_valuation_B: 5.6             # Series F1 May 2024 — VERIFY
    last_round_date: 2024-05-21
    secondary_premium_pct: 20
    illiquidity_discount_pct: 15
    public_comp_ev_to_revenue: 8            # ADYEN/FOUR/AFRM blend
    company_revenue_ttm_B: 0.8              # est ~$700-900M — VERIFY
    notes: |
      Cross-border B2B payments. APAC + EU strength. IPO candidate.

  - name: Boom Supersonic
    weight_pct: 7.11
    last_round_valuation_B: 3.5             # ~early 2024 — VERIFY
    last_round_date: 2024-02-15
    secondary_premium_pct: 0                # no liquid secondary market
    illiquidity_discount_pct: 30            # pre-revenue, milestone risk
    public_comp_ev_to_revenue: null         # not applicable — pre-revenue
    company_revenue_ttm_B: null
    notes: |
      Pre-revenue aerospace. XB-1 demonstrator achieved supersonic flight in
      Jan 2025. Commercial Overture jets still years out. Speculative; valuation
      depends entirely on milestone progress. Last-round method dominates here.

  - name: Oura
    weight_pct: 7.11
    last_round_valuation_B: 5.0             # ~Dec 2024 per press reports — VERIFY
    last_round_date: 2024-12-10
    secondary_premium_pct: 10
    illiquidity_discount_pct: 20
    public_comp_ev_to_revenue: 5            # consumer hardware + subscription
    company_revenue_ttm_B: 0.55             # ~$500-600M reported — VERIFY
    notes: |
      Smart-ring wearable with subscription. Strong brand; recurring revenue.

  - name: Ramp
    weight_pct: 7.11
    last_round_valuation_B: 13.0            # Series E ~April 2025 — VERIFY
    last_round_date: 2025-04-15
    secondary_premium_pct: 10
    illiquidity_discount_pct: 15
    public_comp_ev_to_revenue: 10           # BILL/TOST blend, growth premium
    company_revenue_ttm_B: 0.7              # ARR ~$700M — VERIFY
    notes: |
      Corporate spend management. Very high growth rate justifies premium
      multiple vs public peers. IPO candidate 2026-2027.

  # ---- Post-IPO additions (not in Jan 31 weights) ----
  # These have explicit fund_mark_M (the announced investment amount), so
  # weight_pct is null — they were added after the Jan 31 snapshot.

  - name: OpenAI
    weight_pct: null
    fund_mark_M: 75.00                      # $75M common stock, Apr 17, 2026
    last_round_valuation_B: 852.0           # post-$122B round, early 2026
    last_round_date: 2026-01-15
    secondary_premium_pct: 0                # just bought near current mark
    illiquidity_discount_pct: 10
    public_comp_ev_to_revenue: 45           # AI premium; speculative
    company_revenue_ttm_B: 15.0             # ~$15B run rate late 2025 — VERIFY
    notes: |
      $75M common stock purchase, April 17, 2026 (announced April 22).
      Implies ~0.0088% ownership of OpenAI at $852B post-money. One of
      the few retail vehicles for direct OpenAI exposure.

  - name: Stripe
    weight_pct: null
    fund_mark_M: 14.58                      # Mar 9, 2026, Class B Common
    last_round_valuation_B: 159.0           # Feb 2026 tender at $159B
    last_round_date: 2026-02-24
    secondary_premium_pct: 5
    illiquidity_discount_pct: 15
    public_comp_ev_to_revenue: 12           # PYPL/ADYEN/SQ blend + premium
    company_revenue_ttm_B: 5.0              # est. from $1.9T TPV × take rate
    notes: |
      $14.58M Class B Common March 9, 2026 — secondary purchase.
      Stripe TPV $1.9T (+34% YoY); revenue suite $1B ARR. Collison says no
      imminent IPO. Implies ~0.0092% ownership at $159B.

  - name: ElevenLabs
    weight_pct: null
    fund_mark_M: 20.00                      # Mar 12, 2026, Series D Preferred
    last_round_valuation_B: 11.0            # Series D Feb 4, 2026 at $11B
    last_round_date: 2026-02-04
    secondary_premium_pct: 10
    illiquidity_discount_pct: 15
    public_comp_ev_to_revenue: 30           # AI audio premium
    company_revenue_ttm_B: 0.27             # ~$200M ARR end-2025, growing
    notes: |
      $20M Series D Preferred primary March 12, 2026. AI voice generation.
      Series D led by Sequoia at $11B post-money. ~0.18% ownership.
